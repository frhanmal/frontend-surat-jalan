<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body>
    <nav class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center"><div class="flex items-center gap-3"><i class="fas fa-truck text-2xl"></i><h1 class="text-xl font-bold">Menu Driver</h1></div><a href="index.html" id="btn-kembali" class="bg-white text-blue-800 px-4 py-2 rounded font-semibold text-sm hover:bg-gray-100"><i class="fas fa-arrow-left mr-2"></i>Kembali</a></nav>
    <div class="max-w-xl mx-auto p-4 mt-6">
        <div class="bg-white rounded-xl shadow border p-6">
            <h2 class="text-2xl font-bold border-b pb-4 mb-4 text-orange-600">Update Pengiriman (Driver)</h2>
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1">Scan Barcode / Masukkan 4 Digit Terakhir</label>
                <div class="flex flex-col gap-3 w-full">
                    <input type="text" id="driver-search-id" placeholder="Cth: 3398" class="flex-1 border p-2 rounded outline-none focus:ring-2 focus:ring-orange-500" onkeypress="if(event.key === 'Enter') tambahKeListDriver()">
                    <button type="button" onclick="startScanner()" class="bg-gray-200 text-gray-800 px-4 rounded hover:bg-gray-300"><i class="fas fa-qrcode text-lg"></i></button>
                    <button type="button" onclick="tambahKeListDriver()" class="bg-orange-600 text-white px-4 rounded font-bold hover:bg-orange-700">Tambah</button>
                </div>
            </div>

            <div id="driver-scanned-container" class="hidden mb-4 border rounded bg-orange-50 p-3 border-orange-200">
                <h4 class="font-bold text-orange-900 mb-2 border-b border-orange-200 pb-1">Daftar Barang (Total: <span id="d-scan-count">0</span>)</h4>
                <ul id="driver-scanned-list" class="space-y-2 max-h-40 overflow-y-auto pr-2"></ul>
            </div>

            <div id="driver-form-area" class="hidden border-t pt-4 mt-4">
                <form onsubmit="submitDriver(event)">
                    <div class="mb-4"><label class="block text-sm font-semibold mb-1">Nama Driver <span class="text-red-500">*</span></label><input type="text" id="d-nama" required class="w-full border p-2 rounded outline-none"></div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-1">Foto Bukti Fisik Semua Barang <span class="text-red-500">*</span></label>
                        <div class="flex gap-2 mb-2">
                            <button type="button" onclick="openCameraModal()" class="flex-1 bg-gray-200 border border-gray-400 p-2 rounded font-bold hover:bg-gray-300"><i class="fas fa-camera mr-2"></i> Buka Kamera</button>
                            <label class="flex-1 bg-gray-200 border border-gray-400 p-2 rounded font-bold text-center cursor-pointer pt-2 hover:bg-gray-300"><i class="fas fa-folder-open mr-2"></i> File<input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(this)"></label>
                        </div>
                        <img id="d-foto-preview" class="hidden w-full h-48 object-cover rounded border mt-2" />
                        <input type="hidden" id="d-foto-value">
                    </div>
                    <button type="submit" class="w-full bg-orange-600 text-white font-bold py-3 rounded shadow-sm hover:bg-orange-700">Konfirmasi Bawa Barang</button>
                </form>
            </div>
        </div>
    </div>

    <div id="scanner-modal" class="hidden fixed inset-0 bg-black bg-opacity-80 z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-lg p-4 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2"><h3 class="font-bold text-lg"><i class="fas fa-qrcode mr-2"></i>Scanner</h3><button onclick="stopScanner()" class="text-red-500 font-bold text-xl"><i class="fas fa-times"></i></button></div>
            <div id="reader" width="100%"></div>
            <p class="text-xs text-center text-gray-500 mt-3 font-semibold">Arahkan kamera ke Barcode Garis (1D).</p>
        </div>
    </div>
    
    <div id="camera-modal" class="hidden fixed inset-0 bg-black z-[100] flex flex-col justify-between">
        <div class="flex justify-between p-4 bg-black bg-opacity-50 absolute top-0 w-full z-10"><h3 class="text-white font-bold text-lg">Ambil Foto</h3><button onclick="closeCameraModal()" class="text-white text-3xl"><i class="fas fa-times"></i></button></div>
        <video id="camera-video" autoplay playsinline class="w-full h-full object-cover"></video>
        <div class="absolute bottom-10 w-full flex justify-center z-10"><button type="button" onclick="capturePhoto()" class="bg-white text-black p-4 rounded-full border-4 w-20 h-20 flex items-center justify-center"><i class="fas fa-camera text-3xl"></i></button></div>
        <canvas id="camera-canvas" class="hidden"></canvas>
    </div>

    <script>
        const API_URL = 'https://backend-surat-jalan.vercel.app/api/surat-jalan';
        let driverScannedItems = [], db = [], html5QrcodeScanner = null, mediaStream = null;

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const scanId = urlParams.get('scan_id');
            if (scanId) {
                document.getElementById('driver-search-id').value = scanId;
                
                // Pastikan tombol kembali membawa scan_id ke index.html
                const btnKembali = document.getElementById('btn-kembali');
                if (btnKembali) {
                    btnKembali.href = `index.html?scan_id=${scanId}`;
                }

                setTimeout(tambahKeListDriver, 300);
            }
        });

        function startScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
                fps: 20, 
                qrbox: { width: 300, height: 120 },
                formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128 ]
            }, false);
            html5QrcodeScanner.render((decodedText) => {
                stopScanner();
                let idFound = decodedText.includes('?scan_id=') ? new URLSearchParams(decodedText.split('?')[1]).get('scan_id') : decodedText;
                document.getElementById('driver-search-id').value = idFound;
                tambahKeListDriver();
            }, (error) => {});
        }
        function stopScanner() { if (html5QrcodeScanner) html5QrcodeScanner.clear(); document.getElementById('scanner-modal').classList.add('hidden'); }

        async function openCameraModal() { document.getElementById('camera-modal').classList.remove('hidden'); try { mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); document.getElementById('camera-video').srcObject = mediaStream; } catch (err) { closeCameraModal(); } }
        function closeCameraModal() { if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; } document.getElementById('camera-modal').classList.add('hidden'); }

        function prosesFotoDenganTimestamp(sourceImg, isFileObj = false, callback) {
            const renderCanvas = (imageObj) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = imageObj.width;
                canvas.height = imageObj.height;
                ctx.drawImage(imageObj, 0, 0);

                const sekarang = new Date();
                const timestampText = sekarang.toLocaleString('id-ID');

                const fontSize = Math.max(16, canvas.width / 40);
                ctx.font = `normal ${fontSize}px Arial`; 
                ctx.fillStyle = 'yellow';
                ctx.lineWidth = Math.max(1, fontSize / 20);
                ctx.strokeStyle = 'black';

                const paddingX = 15;
                const paddingY = canvas.height - 15;

                ctx.strokeText(timestampText, paddingX, paddingY);
                ctx.fillText(timestampText, paddingX, paddingY);

                callback(canvas.toDataURL('image/jpeg', 0.7));
            };

            if (isFileObj) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = () => renderCanvas(img);
                    img.src = e.target.result;
                };
                reader.readAsDataURL(sourceImg);
            } else {
                const img = new Image();
                img.onload = () => renderCanvas(img);
                img.src = sourceImg;
            }
        }

        function capturePhoto() { 
            const video = document.getElementById('camera-video'); 
            const canvas = document.getElementById('camera-canvas'); 
            canvas.width = video.videoWidth; 
            canvas.height = video.videoHeight; 
            canvas.getContext('2d').drawImage(video, 0, 0); 
            
            const rawBase64 = canvas.toDataURL('image/jpeg', 0.9);
            closeCameraModal();

            prosesFotoDenganTimestamp(rawBase64, false, function(finalBase64) {
                document.getElementById('d-foto-preview').src = finalBase64; 
                document.getElementById('d-foto-preview').classList.remove('hidden'); 
                document.getElementById('d-foto-value').value = finalBase64;
            });
        }

        function handleFileUpload(input) { 
            if (input.files && input.files[0]) { 
                prosesFotoDenganTimestamp(input.files[0], true, function(finalBase64) {
                    document.getElementById('d-foto-preview').src = finalBase64; 
                    document.getElementById('d-foto-preview').classList.remove('hidden'); 
                    document.getElementById('d-foto-value').value = finalBase64;
                });
            } 
        }

        async function tambahKeListDriver() {
            const inputVal = document.getElementById('driver-search-id').value.trim(); if (!inputVal) return;
            Swal.fire({ title: 'Mencari...', didOpen: () => Swal.showLoading() });
            try {
                const res = await fetch(API_URL); db = await res.json(); Swal.close();
                const data = db.find(x => x.id === inputVal || x.id.endsWith(inputVal));
                
                if (!data) { document.getElementById('driver-search-id').value = ''; return Swal.fire('Error', `Barang tidak ditemukan!`, 'error'); }
                if (driverScannedItems.includes(data.id)) { document.getElementById('driver-search-id').value = ''; return Swal.fire('Peringatan', `ID ${data.id} sudah ada.`, 'warning'); }
                if (data.status !== 'Di Resepsionis') { document.getElementById('driver-search-id').value = ''; return Swal.fire('Info', `Barang ini berstatus: ${data.status}`, 'info'); }

                driverScannedItems.push(data.id); document.getElementById('driver-search-id').value = ''; renderDriverList();
            } catch(e) { Swal.fire('Error', 'Gagal memuat DB', 'error'); }
        }

        function hapusDariListDriver(id) { driverScannedItems = driverScannedItems.filter(x => x !== id); renderDriverList(); }
        function renderDriverList() {
            const container = document.getElementById('driver-scanned-container'); const formArea = document.getElementById('driver-form-area');
            if (driverScannedItems.length === 0) { container.classList.add('hidden'); formArea.classList.add('hidden'); return; }
            container.classList.remove('hidden'); formArea.classList.remove('hidden'); document.getElementById('d-scan-count').innerText = driverScannedItems.length;
            document.getElementById('driver-scanned-list').innerHTML = driverScannedItems.map(id => {
                const data = db.find(x => x.id === id);
                return `<li class="flex justify-between items-center bg-white border p-3 rounded shadow-sm text-sm mb-2"><div><strong class="text-orange-900 text-base">${data.id}</strong><br><span class="text-gray-600">${data.barang} (Jml: ${data.jumlah}) ➔ ${data.tujuan}</span></div><button type="button" onclick="hapusDariListDriver('${id}')" class="text-red-500 bg-red-50 p-3 rounded"><i class="fas fa-trash"></i></button></li>`;
            }).join('');
        }

        async function submitDriver(e) {
            e.preventDefault();
            const base64Img = document.getElementById('d-foto-value').value;
            if (!base64Img) return Swal.fire('Gagal', 'Foto wajib diambil!', 'error');

            Swal.fire({ title: 'Mengirim Data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const payload = { ids: driverScannedItems, driver_nama: document.getElementById('d-nama').value, foto_driver: base64Img, waktu_diambil: new Date().toLocaleString('id-ID') };
            try {
                const res = await fetch(API_URL + '/driver', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!res.ok) throw new Error("Gagal Update Server");
                Swal.fire('Berhasil', `${driverScannedItems.length} Barang dibawa.`, 'success').then(() => { window.location.reload(); });
            } catch (err) { Swal.fire('Error', 'Gagal terkoneksi ke Server', 'error'); }
        }
    </script>
</body>
</html>
