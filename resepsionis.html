<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resepsionis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        @media print {
            @page { size: 80mm 80mm; margin: 0mm !important; }
            html, body { background-color: white !important; margin: 0 !important; padding: 0 !important; width: 80mm; height: 80mm; }
            .no-print, nav, .swal2-container { display: none !important; }
            #print-area { width: 100%; font-family: Arial, sans-serif; }
            #print-barcode-area { width: 80mm; height: 80mm; margin: 0; padding: 0; display: block; }
            /* Garis putus-putus dikembalikan dengan menghapus border: none */
            .print-label-wrapper { width: 80mm !important; height: 80mm !important; page-break-after: always !important; margin: 0 !important; box-sizing: border-box !important; }
        }
    </style>
</head>
<body>
    <nav class="bg-blue-800 text-white p-4 shadow-md no-print flex justify-between items-center"><div class="flex items-center gap-3"><i class="fas fa-laptop text-2xl"></i><h1 class="text-xl font-bold">Menu Resepsionis</h1></div><a href="index.html" class="bg-white text-blue-800 px-4 py-2 rounded font-semibold text-sm hover:bg-gray-100"><i class="fas fa-arrow-left mr-2"></i> Kembali</a></nav>

    <div class="max-w-3xl mx-auto p-4 mt-6 no-print" id="app-container">
        <div id="resepsionis-form-container" class="bg-white rounded-xl shadow-sm border p-6">
            <h2 class="text-2xl font-bold border-b pb-4 mb-4">Buat Surat Jalan Baru</h2>
            <form id="form-resepsionis" onsubmit="submitResepsionis(event)">
                <div id="dynamic-items-container">
                    <div class="item-block bg-gray-50 border p-4 rounded-lg mb-4 relative">
                        <h3 class="font-bold text-gray-700 mb-3 border-b pb-2">Data Barang #1</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 bg-blue-50 p-3 rounded border border-blue-100">
                            <div><label class="block text-sm font-semibold mb-1">Nama Pengirim <span class="text-red-500">*</span></label><input type="text" required class="i-pengirim w-full border p-2 rounded outline-none"></div>
                            <div><label class="block text-sm font-semibold mb-1">Penerima Tujuan (UP) <span class="text-red-500">*</span></label><input type="text" required class="i-up w-full border p-2 rounded outline-none"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                            <div><label class="block text-sm font-semibold mb-1">Nama Barang <span class="text-red-500">*</span></label><input type="text" required class="i-barang w-full border p-2 rounded outline-none"></div>
                            <div><label class="block text-sm font-semibold mb-1">Jumlah <span class="text-red-500">*</span></label><input type="number" min="1" required class="i-jumlah w-full border p-2 rounded outline-none"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-sm font-semibold mb-1">Tujuan / Site <span class="text-red-500">*</span></label><input type="text" required class="i-tujuan w-full border p-2 rounded outline-none"></div>
                            <div><label class="block text-sm font-semibold mb-1">Alamat Tujuan <span class="text-red-500">*</span></label><textarea required rows="1" class="i-alamat w-full border p-2 rounded outline-none"></textarea></div>
                        </div>
                    </div>
                </div>
                <button type="button" onclick="tambahBarang()" class="w-full bg-gray-200 font-bold py-2 rounded mb-6 border-dashed border border-gray-400 hover:bg-gray-300"><i class="fas fa-plus mr-2"></i> Tambah Barang Lain</button>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700">Generate Surat Jalan</button>
            </form>
        </div>
        <div id="resepsionis-success" class="hidden bg-white rounded-xl shadow-sm border p-8 text-center">
            <i class="fas fa-check-circle text-6xl text-green-500 mb-4"></i><h2 class="text-2xl font-bold mb-2">Berhasil Dibuat!</h2>
            <div id="success-id-list" class="text-left bg-gray-50 p-4 rounded border mb-6 max-h-64 overflow-y-auto"></div>
            <div class="flex justify-center gap-3 flex-wrap">
                <button onclick="location.reload()" class="px-6 py-3 border rounded font-semibold hover:bg-gray-100">Buat Baru</button>
                <button id="btn-cetak-master" class="px-6 py-3 bg-blue-600 text-white rounded font-bold shadow-md hover:bg-blue-700"><i class="fas fa-print mr-2"></i>Cetak Surat Induk</button>
                <button id="btn-cetak-semua-barcode" class="px-6 py-3 bg-gray-800 text-white rounded font-bold shadow-md hover:bg-gray-900"><i class="fas fa-qrcode mr-2"></i>Cetak Semua Barcode</button>
            </div>
        </div>
    </div>

    <div id="print-area" style="display: none;" class="bg-white p-8">
        <div style="max-width: 800px; margin: 0 auto; line-height: 1.5; font-size: 13px;">
            <div style="display: flex; justify-content: space-between; border-bottom: 2px solid black; padding-bottom: 10px; margin-bottom: 20px;">
                <div><h1 style="font-size: 26px; font-weight: bold; margin: 0;"></h1><p style="font-size: 11px; margin: 0;"></p></div><div style="text-align: right;"><h2 style="font-size: 18px; margin: 0; font-weight: normal;">FORMULIR PENGIRIMAN</h2></div>
            </div>
            <div style="margin-bottom: 20px;"><p style="margin: 0 0 15px 0;">Kepada<br>GS Dept<br>Expedition & Mail</p><p style="margin: 0; font-weight: bold;">Pengirim : <span id="print-pengirim"></span></p></div>
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px; text-align: left; font-size: 12px;">
                <thead><tr><th style="border: 1px solid black; padding: 10px; text-align: center; width: 5%;">NO</th><th style="border: 1px solid black; padding: 10px; width: 35%;">NAMA BARANG</th><th style="border: 1px solid black; padding: 10px; text-align: center; width: 10%;">JUMLAH</th><th style="border: 1px solid black; padding: 10px; width: 25%;">TUJUAN / SITE</th><th style="border: 1px solid black; padding: 10px; width: 25%;">UNTUK / UP</th></tr></thead>
                <tbody id="print-tbody"></tbody>
            </table>
            <div id="print-tanggal" style="text-align: right; margin-bottom: 15px; font-size: 13px;">Cileungsi, ......................... 20...</div>
            <div style="display: flex; justify-content: space-between; text-align: center; font-size: 13px;">
                <div style="width: 30%; display: flex; flex-direction: column; justify-content: space-between;"><p style="margin-bottom: 10px;">Yang menerima</p><div style="height: 60px; display: flex; justify-content: center; align-items: end;"><img id="print-ttd-master" style="max-height: 100%; display: none;"></div><p id="print-nama-penerima-master" style="border-bottom: 1px solid black; margin: 0; padding-bottom: 5px; min-height: 20px;"></p></div>
                <div style="width: 30%; display: flex; flex-direction: column; justify-content: space-between;"><p style="margin-bottom: 10px;">Menyetujui,</p><div style="height: 60px;"></div><p style="border-bottom: 1px solid black; margin: 0; padding-bottom: 5px; min-height: 20px;"></p></div>
                <div style="width: 30%; display: flex; flex-direction: column; justify-content: space-between;"><p style="margin-bottom: 10px;">Pengirim,</p><div style="height: 60px;"></div><p style="border-bottom: 1px solid black; margin: 0; padding-bottom: 5px; min-height: 20px;">Resepsionis</p></div>
            </div>
        </div>
    </div>
    
    <div id="print-barcode-area" style="display: none;" class="bg-white"><div id="barcode-dynamic-container"></div></div>

    <script>
        const API_URL = 'https://backend-surat-jalan.vercel.app/api/surat-jalan';
        let itemCounter = 1, generatedData = [];

        function tambahBarang() {
            itemCounter++; const container = document.getElementById('dynamic-items-container'); const newBlock = document.createElement('div');
            newBlock.className = 'item-block bg-gray-50 border p-4 rounded-lg mb-4 relative mt-2';
            newBlock.innerHTML = `
                <button type="button" onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-red-500 font-bold"><i class="fas fa-times"></i> Hapus</button>
                <h3 class="font-bold text-gray-700 mb-3 border-b pb-2">Data Barang #${itemCounter}</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 bg-blue-50 p-3 rounded border border-blue-100">
                    <div><label class="block text-sm font-semibold mb-1">Nama Pengirim <span class="text-red-500">*</span></label><input type="text" required class="i-pengirim w-full border p-2 rounded outline-none"></div>
                    <div><label class="block text-sm font-semibold mb-1">Penerima Tujuan (UP) <span class="text-red-500">*</span></label><input type="text" required class="i-up w-full border p-2 rounded outline-none"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                    <div><label class="block text-sm font-semibold mb-1">Nama Barang <span class="text-red-500">*</span></label><input type="text" required class="i-barang w-full border p-2 rounded outline-none"></div>
                    <div><label class="block text-sm font-semibold mb-1">Jumlah <span class="text-red-500">*</span></label><input type="number" min="1" required class="i-jumlah w-full border p-2 rounded outline-none"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-semibold mb-1">Tujuan / Site <span class="text-red-500">*</span></label><input type="text" required class="i-tujuan w-full border p-2 rounded outline-none"></div>
                    <div><label class="block text-sm font-semibold mb-1">Alamat Tujuan <span class="text-red-500">*</span></label><textarea required rows="1" class="i-alamat w-full border p-2 rounded outline-none"></textarea></div>
                </div>`;
            container.appendChild(newBlock);
        }

        async function submitResepsionis(e) {
            e.preventDefault();
            const blocks = document.querySelectorAll('.item-block');
            generatedData = [];

            blocks.forEach(block => {
                const newID = `SJ-${new Date().toISOString().slice(2, 10).replace(/-/g, '')}-${Math.floor(1000 + Math.random() * 9000)}`;
                generatedData.push({
                    id: newID, waktu_dibuat: new Date().toLocaleString('id-ID'),
                    pengirim: block.querySelector('.i-pengirim').value, up: block.querySelector('.i-up').value,
                    barang: block.querySelector('.i-barang').value, jumlah: block.querySelector('.i-jumlah').value,
                    tujuan: block.querySelector('.i-tujuan').value, alamat: block.querySelector('.i-alamat').value,
                });
            });

            Swal.fire({ title: 'Menyimpan Data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(generatedData) });
                if (!res.ok) throw new Error();
                
                document.getElementById('form-resepsionis').reset();
                document.getElementById('resepsionis-form-container').classList.add('hidden');
                document.getElementById('resepsionis-success').classList.remove('hidden');

                const listDiv = document.getElementById('success-id-list'); listDiv.innerHTML = '';
                generatedData.forEach(d => {
                    listDiv.innerHTML += `<div class="flex justify-between items-center p-3 border-b bg-white mb-2 shadow-sm rounded"><div><strong class="text-blue-700">${d.id}</strong><br><span class="text-sm text-gray-600">${d.barang} (Jml: ${d.jumlah}) ➔ ${d.tujuan}</span></div><button onclick="cetakBarcodeTunggal('${d.id}')" class="bg-gray-800 text-white px-3 py-2 text-sm rounded hover:bg-gray-900"><i class="fas fa-qrcode mr-1"></i> Cetak Label</button></div>`;
                });
                
                document.getElementById('btn-cetak-master').setAttribute('onclick', `cetakMasterSuratJalan('${JSON.stringify(generatedData.map(d=>d.id))}')`);
                document.getElementById('btn-cetak-semua-barcode').setAttribute('onclick', `cetakBanyakBarcode('${JSON.stringify(generatedData.map(d=>d.id))}')`);
                Swal.close();
            } catch (err) { Swal.fire('Error', 'Gagal update ke API', 'error'); }
        }

        function getTanggalIndo() {
            const bulanIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const date = new Date();
            return `Cileungsi, ${date.getDate()} ${bulanIndo[date.getMonth()]} ${date.getFullYear()}`;
        }

        function cetakMasterSuratJalan(idsJsonArray) {
            const ids = JSON.parse(idsJsonArray); if (ids.length === 0) return;
            const itemPertama = generatedData.find(x => x.id === ids[0]);
            const pengirimData = itemPertama ? itemPertama.pengirim : '';
            
            document.getElementById('print-pengirim').innerText = pengirimData;
            document.getElementById('print-tanggal').innerText = getTanggalIndo(); 

            const tbody = document.getElementById('print-tbody'); tbody.innerHTML = '';
            let previewTableHtml = `<table class="w-full text-left text-xs border mb-4"><thead><tr class="bg-gray-100 border-b"><th>Barang</th><th>Tujuan</th></tr></thead><tbody>`;
            
            ids.forEach((id, index) => {
                const item = generatedData.find(x => x.id === id);
                if (item) {
                    tbody.innerHTML += `<tr><td style="border: 1px solid black; padding: 10px; text-align: center;">${index + 1}</td><td style="border: 1px solid black; padding: 10px;">${item.barang}<br><span class="block text-gray-500 text-[10px] mt-1">ID: ${item.id}</span></td><td style="border: 1px solid black; padding: 10px; text-align: center;">${item.jumlah}</td><td style="border: 1px solid black; padding: 10px;">${item.tujuan}<br><span class="block text-gray-500 text-[10px] mt-1">${item.alamat}</span></td><td style="border: 1px solid black; padding: 10px;">${item.up}</td></tr>`;
                    previewTableHtml += `<tr class="border-b"><td class="p-1">${item.barang}</td><td class="p-1">${item.tujuan}</td></tr>`;
                }
            });
            previewTableHtml += `</tbody></table>`;

            Swal.fire({
                title: 'Preview Formulir Induk',
                html: `<div class="text-sm text-left"><p class="mb-2"><strong>Pengirim:</strong> ${pengirimData}</p>${previewTableHtml}<p class="text-gray-500">Formulir siap dicetak.</p></div>`,
                showCancelButton: true, confirmButtonText: '<i class="fas fa-print mr-2"></i> Cetak', cancelButtonText: 'Batal', confirmButtonColor: '#2563eb', returnFocus: false
            }).then((res) => {
                if (res.isConfirmed) {
                    setTimeout(() => {
                        document.getElementById('app-container').style.display = 'none'; 
                        document.getElementById('print-barcode-area').style.display = 'none'; 
                        document.getElementById('print-area').style.display = 'block'; 
                        window.print(); 
                        document.getElementById('app-container').style.display = 'block'; 
                        document.getElementById('print-area').style.display = 'none';
                    }, 400);
                }
            });
        }

        function cetakBarcodeTunggal(id) { cetakBanyakBarcode(JSON.stringify([id])); }
        function cetakBanyakBarcode(idsJsonArray) {
            const ids = JSON.parse(idsJsonArray); if (ids.length === 0) return;
            const container = document.getElementById('barcode-dynamic-container'); container.innerHTML = '';
            
            ids.forEach(id => {
                const data = generatedData.find(x => x.id === id);
                if (data) {
                    const qrUrl = window.location.origin + "/index.html?scan_id=" + data.id;
                    const wrapper = document.createElement('div'); wrapper.className = 'print-label-wrapper';
                    
                    // PERBAIKAN: Flex-start (agar merapat ke atas), padding disesuaikan, dan border-dashed diaktifkan
                    wrapper.style.cssText = 'width: 80mm; height: 80mm; margin: 0; padding: 4mm; box-sizing: border-box; border: 2px dashed #000; text-align: center; font-family: Arial, sans-serif; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; background: white;';
                    
                    wrapper.innerHTML = `
                        <h3 style="margin: 0 0 5px 0; font-size: 16px; font-weight: bold; letter-spacing: 0.5px;">LABEL PENGIRIMAN</h3>
                        <div id="qr-${data.id}" style="display: flex; justify-content: center; margin-bottom: 5px;"></div>
                        <div style="display: flex; justify-content: center; width: 100%; overflow: hidden;"><svg id="bc-${data.id}"></svg></div>
                        <p style="font-weight: bold; font-size: 14px; margin: 5px 0;">${data.id}</p>
                        <hr style="margin: 5px 0; width: 100%; border-top: 1px dashed #ccc;">
                        <div style="font-size: 11px; line-height: 1.4; text-align: left; width: 100%;">
                            <strong>Penerima:</strong> ${data.up}<br>
                            <strong>Tujuan:</strong> ${data.tujuan}<br>
                            <strong>Barang:</strong> ${data.barang} (${data.jumlah})
                        </div>`;
                    container.appendChild(wrapper);
                    
                    setTimeout(() => {
                        new QRCode(document.getElementById(`qr-${data.id}`), { text: qrUrl, width: 110, height: 110, correctLevel: QRCode.CorrectLevel.L });
                        JsBarcode(`#bc-${data.id}`, data.id, { format: "CODE128", width: 1.6, height: 40, displayValue: false, margin: 0 });
                    }, 100);
                }
            });

            const firstId = ids[0];
            Swal.fire({
                title: 'Preview Printer',
                html: `<div class="flex flex-col items-center p-4 border border-dashed rounded bg-gray-50"><h3 class="font-bold mb-2 text-base">LABEL PENGIRIMAN</h3><div id="swal-qr" class="mb-2"></div><svg id="swal-bc" class="w-full h-10"></svg><p class="font-bold mt-2 text-sm">${firstId}</p></div><p class="mt-3 text-xs text-red-600 font-bold">Pastikan Paper Size 80mm x 80mm, Margin: None</p>`,
                showCancelButton: true, confirmButtonText: '<i class="fas fa-print mr-2"></i> Cetak Label', cancelButtonText: 'Batal', confirmButtonColor: '#2563eb', returnFocus: false,
                didOpen: () => {
                    new QRCode(document.getElementById('swal-qr'), { text: window.location.origin + "/index.html?scan_id=" + firstId, width: 110, height: 110, correctLevel: QRCode.CorrectLevel.L });
                    JsBarcode("#swal-bc", firstId, { format: "CODE128", width: 1.6, height: 40, displayValue: false, margin: 0 });
                }
            }).then((res) => {
                if (res.isConfirmed) {
                    setTimeout(() => {
                        document.getElementById('app-container').style.display = 'none'; 
                        document.getElementById('print-area').style.display = 'none'; 
                        document.getElementById('print-barcode-area').style.display = 'block'; 
                        window.print(); 
                        document.getElementById('app-container').style.display = 'block'; 
                        document.getElementById('print-barcode-area').style.display = 'none';
                    }, 400);
                }
            });
        }
    </script>
</body>
</html>
