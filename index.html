<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Memastikan responsif di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Surat Jalan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="bg-blue-800 text-white p-4 shadow-md flex items-center gap-3">
        <i class="fas fa-box-open text-2xl"></i>
        <h1 class="text-xl font-bold">Digital Surat Jalan</h1>
    </nav>

    <!-- Main Content -->
    <div class="max-w-3xl mx-auto p-4 mt-10">
        <div class="bg-white rounded-xl shadow-sm border p-8">
            <div class="text-center mb-8">
                <i class="fas fa-cube text-5xl text-blue-600 mb-4"></i>
                <h2 class="text-2xl font-bold">Pilih Role Anda</h2>
                <p class="text-gray-500 mt-2">Pilih menu akses untuk masuk ke sistem.</p>
            </div>

            <div class="space-y-4">
                <!-- Resepsionis -->
                <a href="resepsionis.html" id="menu-resepsionis" class="block bg-gray-50 p-4 rounded-xl border hover:shadow-md transition-shadow flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="bg-blue-100 p-3 rounded-lg text-blue-600"><i class="fas fa-laptop text-xl"></i></div>
                        <div><h3 class="font-bold text-gray-800">Resepsionis</h3><p class="text-sm text-gray-500">Buat Surat Jalan Baru</p></div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </a>

                <!-- Driver -->
                <a href="driver.html" id="link-driver" class="block bg-gray-50 p-4 rounded-xl border hover:shadow-md transition-shadow flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="bg-orange-100 p-3 rounded-lg text-orange-600"><i class="fas fa-truck text-xl"></i></div>
                        <div><h3 class="font-bold text-gray-800">Driver</h3><p class="text-sm text-gray-500">Update Pengambilan Barang</p></div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </a>

                <!-- Penerima -->
                <a href="penerima.html" id="link-penerima" class="block bg-gray-50 p-4 rounded-xl border hover:shadow-md transition-shadow flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="bg-purple-100 p-3 rounded-lg text-purple-600"><i class="fas fa-box text-xl"></i></div>
                        <div><h3 class="font-bold text-gray-800">Penerima</h3><p class="text-sm text-gray-500">Konfirmasi Terima & Tanda Tangan</p></div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </a>

                <!-- PIC Dashboard (Diubah jadi Button untuk trigger Password) -->
                <button onclick="loginPIC(event)" id="menu-pic" class="w-full text-left block bg-gray-50 p-4 rounded-xl border hover:shadow-md transition-shadow flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="bg-green-100 p-3 rounded-lg text-green-600"><i class="fas fa-table-columns text-xl"></i></div>
                        <div><h3 class="font-bold text-gray-800">PIC Dashboard</h3><p class="text-sm text-gray-500">Monitoring & Rekap Data</p></div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FITUR HIDE MENU SAAT DI-SCAN VIA BARCODE ---
        window.onload = function() {
            // Cek apakah ada '?scan_id=...' di URL
            const urlParams = new URLSearchParams(window.location.search);
            const scanId = urlParams.get('scan_id');

            if (scanId) {
                const menuResepsionis = document.getElementById('menu-resepsionis');
                const menuPic = document.getElementById('menu-pic');
                
                // Sembunyikan menu resepsionis dan PIC
                if(menuResepsionis) menuResepsionis.style.display = 'none';
                if(menuPic) menuPic.style.display = 'none';

                // Otomatis menempelkan ID Surat Jalan ke tombol Driver dan Penerima
                const linkDriver = document.getElementById('link-driver');
                const linkPenerima = document.getElementById('link-penerima');
                
                if(linkDriver) linkDriver.href = 'driver.html?scan_id=' + scanId;
                if(linkPenerima) linkPenerima.href = 'penerima.html?scan_id=' + scanId;
            }
        };

        // --- 2. FITUR LOGIN PIC DASHBOARD DENGAN PASSWORD "GSCCOS" ---
        function loginPIC(e) {
            if(e) e.preventDefault(); // Mencegah reload halaman
            
            Swal.fire({
                title: 'Akses Terkunci',
                html: '<input id="swal-pass" type="password" class="swal2-input" placeholder="Masukkan Password">',
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Masuk',
                confirmButtonColor: '#2563eb',
                preConfirm: () => {
                    const pass = document.getElementById('swal-pass').value;
                    if (!pass) Swal.showValidationMessage('Password wajib diisi!');
                    return pass;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const pass = result.value;
                    
                    // Cek apakah password cocok
                    if (pass === "GSCCOS") {
                        Swal.fire({ 
                            icon: 'success', 
                            title: 'Berhasil', 
                            text: 'Membuka Dashboard...',
                            showConfirmButton: false, 
                            timer: 1500 
                        });
                        // Pindah ke halaman dashboard setelah 1.5 detik
                        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                    } else {
                        Swal.fire('Akses Ditolak', 'Password salah!', 'error');
                    }
                }
            });
        }
    </script>
</body>
</html>
