<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Digital Surat Jalan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; } .menu-card { transition: all 0.2s ease; cursor: pointer; } .menu-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }</style>
</head>
<body>
    <nav class="bg-blue-800 text-white p-4 shadow-md"><div class="max-w-6xl mx-auto flex items-center gap-3"><i class="fas fa-box-open text-2xl"></i><h1 class="text-xl font-bold">Digital Surat Jalan</h1></div></nav>
    <div class="max-w-2xl mx-auto p-4 mt-10">
        <div class="bg-white rounded-xl shadow border p-8 text-center">
            <i class="fas fa-cube text-5xl text-blue-600 mb-4"></i><h2 class="text-2xl font-bold mb-2">Pilih Role Anda</h2><p class="text-gray-500 mb-8">Pilih menu akses untuk masuk ke sistem.</p>
            <div class="space-y-4 text-left">
                <!-- Menu Resepsionis (Password CCOS) -->
                <div id="menu-resepsionis" onclick="loginResepsionis()" class="menu-card flex items-center p-4 border rounded-lg hover:border-blue-500 hover:bg-blue-50">
                    <div class="bg-blue-100 text-blue-600 p-3 rounded-lg mr-4"><i class="fas fa-laptop text-xl"></i></div>
                    <div class="flex-1"><h3 class="font-bold text-gray-800">Resepsionis</h3><p class="text-sm text-gray-500">Buat Surat Jalan Baru</p></div><i class="fas fa-chevron-right text-gray-300"></i>
                </div>
                
                <!-- Menu Driver -->
                <div id="link-driver" onclick="navigateRole('driver.html')" class="menu-card flex items-center p-4 border rounded-lg hover:border-orange-500 hover:bg-orange-50">
                    <div class="bg-orange-100 text-orange-600 p-3 rounded-lg mr-4"><i class="fas fa-truck text-xl"></i></div>
                    <div class="flex-1"><h3 class="font-bold text-gray-800">Driver</h3><p class="text-sm text-gray-500">Update Pengambilan Barang</p></div><i class="fas fa-chevron-right text-gray-300"></i>
                </div>
                
                <!-- Menu Penerima -->
                <div id="link-penerima" onclick="navigateRole('penerima.html')" class="menu-card flex items-center p-4 border rounded-lg hover:border-purple-500 hover:bg-purple-50">
                    <div class="bg-purple-100 text-purple-600 p-3 rounded-lg mr-4"><i class="fas fa-box-open text-xl"></i></div>
                    <div class="flex-1"><h3 class="font-bold text-gray-800">Penerima</h3><p class="text-sm text-gray-500">Konfirmasi Terima & Tanda Tangan</p></div><i class="fas fa-chevron-right text-gray-300"></i>
                </div>
                
                <!-- Menu PIC Dashboard (Password GSCCOS) -->
                <div id="menu-pic" onclick="loginPIC()" class="menu-card flex items-center p-4 border rounded-lg hover:border-green-500 hover:bg-green-50">
                    <div class="bg-green-100 text-green-600 p-3 rounded-lg mr-4"><i class="fas fa-table-columns text-xl"></i></div>
                    <div class="flex-1"><h3 class="font-bold text-gray-800">PIC Dashboard</h3><p class="text-sm text-gray-500">Monitoring & Rekap Data</p></div><i class="fas fa-chevron-right text-gray-300"></i>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let scanIdGlobal = null;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            scanIdGlobal = urlParams.get('scan_id');

            if (scanIdGlobal) {
                // Hide Resepsionis dan PIC Dashboard jika diakses via Scan Barcode
                const menuResepsionis = document.getElementById('menu-resepsionis');
                const menuPic = document.getElementById('menu-pic');
                
                if(menuResepsionis) menuResepsionis.style.display = 'none';
                if(menuPic) menuPic.style.display = 'none';
            }
        };

        function navigateRole(targetPage) {
            if (scanIdGlobal) {
                window.location.href = `${targetPage}?scan_id=${scanIdGlobal}`;
            } else {
                window.location.href = targetPage;
            }
        }

        async function loginResepsionis() {
            const result = await Swal.fire({ 
                title: 'Akses Resepsionis', 
                input: 'password', 
                inputPlaceholder: 'Masukkan Password', 
                showCancelButton: true,
                confirmButtonColor: '#2563eb'
            });
            if (result.isConfirmed) {
                if (result.value === 'CCOS') {
                    window.location.href = 'resepsionis.html';
                } else {
                    Swal.fire('Ditolak', 'Password salah!', 'error');
                }
            }
        }

        async function loginPIC() {
            const result = await Swal.fire({ 
                title: 'Akses PIC Dashboard', 
                input: 'password', 
                inputPlaceholder: 'Masukkan Password', 
                showCancelButton: true,
                confirmButtonColor: '#2563eb'
            });
            if (result.isConfirmed) {
                if (result.value === 'GSCCOS') {
                    window.location.href = 'dashboard.html';
                } else {
                    Swal.fire('Ditolak', 'Password salah!', 'error');
                }
            }
        }
    </script>
</body>
</html>
